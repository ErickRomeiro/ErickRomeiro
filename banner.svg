<svg width="1500" height="300" viewBox="0 0 1500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="300" fill="url(#bgGrad)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="300" fill="url(#accentGrad)"/>

  <!-- Subtle monogram on right (decorative) -->
  <g opacity="0.06" transform="translate(1180, 30)">
    <text x="0" y="220" font-family="Inter, -apple-system, sans-serif" font-size="280" font-weight="900" fill="#58a6ff" letter-spacing="-10">ER</text>
  </g>

  <!-- Subtle grid dots (right side decoration) -->
  <g opacity="0.08" fill="#58a6ff">
    <circle cx="1050" cy="50" r="2"/>
    <circle cx="1080" cy="50" r="2"/>
    <circle cx="1110" cy="50" r="2"/>
    <circle cx="1050" cy="80" r="2"/>
    <circle cx="1080" cy="80" r="2"/>
    <circle cx="1050" cy="110" r="2"/>
  </g>

  <!-- Name -->
  <text x="80" y="120" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">Erick Gabriel de Souza Romeiro</text>

  <!-- Accent divider -->
  <rect x="80" y="142" width="56" height="3" fill="url(#accentGrad)" rx="1.5"/>

  <!-- Tagline -->
  <text x="80" y="188" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#c9d1d9">Building internal tools with TypeScript</text>

  <!-- Stack -->
  <text x="80" y="224" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="17" font-weight="400" fill="#8b949e">TypeScript  ·  React  ·  Vite  ·  Node</text>

  <!-- Location -->
  <g transform="translate(80, 254)">
    <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
    <text x="20" y="11" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#6e7681">Campo Grande, MS — Brazil</text>
  </g>
</svg>
